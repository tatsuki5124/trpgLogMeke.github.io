<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>ログ出力比較</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
        background: #f3f4f1;
        color: #202020;
      }
      header {
        padding: 1rem 1.25rem;
        border-bottom: 1px solid #d0d4cc;
        background: #ffffff;
      }
      h1 {
        margin: 0 0 .4rem;
        font-size: 1.2rem;
      }
      header p {
        margin: 0;
        color: #555555;
        font-size: .92rem;
      }
      main {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 1rem;
        padding: 1rem;
      }
      .variant {
        min-width: 0;
      }
      h2 {
        margin: 0 0 .3rem;
        font-size: 1rem;
      }
      .variant p {
        margin: 0 0 .5rem;
        font-size: .88rem;
      }
      iframe {
        width: 100%;
        height: 78vh;
        border: 1px solid #c8c8c8;
        background: #ffffff;
      }
      @media (max-width: 1100px) {
        main {
          grid-template-columns: 1fr;
        }
        iframe {
          height: 72vh;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>ログ出力比較</h1>
      <p>同一fixtureから生成した本文色・名前マーカー・地の文の候補を、ライト/ダークで比較するための確認ページです。</p>
    </header>
    <main>
      <section class="variant">
        <h2>ライト / 名前後ろライン</h2>
        <p><a href="./speaker-after-line.html" target="_blank" rel="noreferrer">別タブで開く</a></p>
        <iframe title="ライト 名前後ろライン" src="./speaker-after-line.html"></iframe>
      </section>
<section class="variant">
        <h2>ライト / 本文ガイド</h2>
        <p><a href="./speaker-body-guide.html" target="_blank" rel="noreferrer">別タブで開く</a></p>
        <iframe title="ライト 本文ガイド" src="./speaker-body-guide.html"></iframe>
      </section>
<section class="variant">
        <h2>ライト / 統合候補</h2>
        <p><a href="./candidate-combined.html" target="_blank" rel="noreferrer">別タブで開く</a></p>
        <iframe title="ライト 統合候補" src="./candidate-combined.html"></iframe>
      </section>
<section class="variant">
        <h2>ダーク / 名前後ろライン</h2>
        <p><a href="./speaker-after-line-dark.html" target="_blank" rel="noreferrer">別タブで開く</a></p>
        <iframe title="ダーク 名前後ろライン" src="./speaker-after-line-dark.html"></iframe>
      </section>
<section class="variant">
        <h2>ダーク / 本文ガイド</h2>
        <p><a href="./speaker-body-guide-dark.html" target="_blank" rel="noreferrer">別タブで開く</a></p>
        <iframe title="ダーク 本文ガイド" src="./speaker-body-guide-dark.html"></iframe>
      </section>
<section class="variant">
        <h2>ダーク / 統合候補</h2>
        <p><a href="./candidate-combined-dark.html" target="_blank" rel="noreferrer">別タブで開く</a></p>
        <iframe title="ダーク 統合候補" src="./candidate-combined-dark.html"></iframe>
      </section>
    </main>
  </body>
</html>
